name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build data bundle
        run: node scripts/buildDataBundle.js

      - name: Build NSIS installer
        shell: cmd
        run: node_modules\.bin\electron-builder.cmd --win nsis

      - name: List output
        shell: cmd
        run: dir dist /s /b

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - 雾岛商店 & 购物车系统
          body: |
            ## 新功能

            ### 雾岛世界商店
            - 新增雾岛世界，含 **83 项商品**
            - 武器 11 项 | 道具 56 项 | 防具 6 项 | 强化 10 项

            ### 购物车系统
            - **限定物品**：限购一次，已有则不可再购
            - **非限定物品**：支持增减数量，确认兑换一次性提交
            - 会话内退款 100%，切换角色自动清空

            ### CI/CD
            - 推送 tag 自动构建发布

            ## 安装说明
            已安装旧版本的用户打开应用点击工具栏 **🔄 更新** 即可自动升级。
          draft: ${{ github.event.inputs.draft || false }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: false
